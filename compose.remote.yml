services:
  gpt-live-1-demo:
    build: .
    env_file:
      - .env
    environment:
      APP_MODE: remote
      HOST: 0.0.0.0
      PORT: 8767
      APP_DATA_DIR: /data
    ports:
      - "8767:8767"
    volumes:
      - gpt-live-1-demo-data:/data
    restart: unless-stopped

volumes:
  gpt-live-1-demo-data:
