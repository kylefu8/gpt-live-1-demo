name: Windows release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:release
      - run: npm run build:release -- --out-dir release
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-live-1-demo-windows-x64
          path: '*.zip'
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath . -Filter '*-windows-x64.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Release archive missing' }
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($archive.Name)" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
          gh release create $env:RELEASE_TAG $archive.FullName SHA256SUMS.txt --title $env:RELEASE_TAG --notes-file docs/RELEASE-NOTES.md
