services:
  gpt-live-1-demo:
    build: .
    environment:
      APP_MODE: local
      HOST: 0.0.0.0
      ALLOW_LOCAL_NETWORK: "1"
      PORT: 8767
      APP_DATA_DIR: /data
    ports:
      - "127.0.0.1:8767:8767"
    volumes:
      - gpt-live-1-demo-data:/data
    restart: unless-stopped

volumes:
  gpt-live-1-demo-data:
